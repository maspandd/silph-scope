<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com; style-src 'self'; script-src 'self'">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <link rel="stylesheet" href="css/app.css">
    <title>Tapjack Example</title>
</head>
<body>
    <h1>Tapjack Protection</h1>

    <section>
        <button id="tap" class="big">Tap me</button>
        <p>Taps received: <strong id="count">0</strong></p>
    </section>

    <section class="row">
        <button data-mode="block">Block</button>
        <button data-mode="block" data-strict="true">Block (strict)</button>
        <button data-mode="detect">Detect</button>
        <button id="disable">Off</button>
    </section>

    <section>
        <h2>Status</h2>
        <pre id="status">waiting for deviceready...</pre>
    </section>

    <section>
        <h2>Obscured touches</h2>
        <div id="warning" hidden>Another app is drawing over this screen. Close it to continue.</div>
        <ol id="log"></ol>
    </section>

    <script src="cordova.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
