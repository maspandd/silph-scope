plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tapjackos.attacker'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tapjackos.attacker'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
